[package]
name = "bare"
version = "0.4.0"
edition = "2024"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
fontdue = "0.9.3"
fontconfig = "0.10"
nix = { version = "0.31.2", features = ["fs", "net"] }
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
tz-rs = "0.7.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
pipewire-native = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-native-rs.git", rev = "bc7fb9287e84e0e7dffe3f37dbaa0b8d761aeb9b" }
pipewire-native-spa = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-native-rs.git", rev = "bc7fb9287e84e0e7dffe3f37dbaa0b8d761aeb9b" }
clap = { version = "4", features = ["derive"] }
neli-wifi = "0.6.1"

[dev-dependencies]
pretty_assertions = "1"
